<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="100%" role="img" aria-labelledby="tr">
<title id="tr">Mapa de red: los clientes pasan por el cortafuegos antes de llegar a los servicios, y el tráfico malicioso se bloquea</title>

<defs>
<path id="a1" d="M168 90 L536 148" fill="none"/>
<path id="a2" d="M168 190 L536 182" fill="none"/>
<path id="a3" d="M168 290 L536 216" fill="none"/>
<path id="b1" d="M664 148 L1032 90" fill="none"/>
<path id="b2" d="M664 182 L1032 190" fill="none"/>
<path id="b3" d="M664 216 L1032 290" fill="none"/>
<linearGradient id="esc" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#B026FF" stop-opacity=".28"/>
  <stop offset="1" stop-color="#B026FF" stop-opacity=".06"/>
</linearGradient>
</defs>

<style>
.m{font-family:ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
</style>

<rect width="1200" height="380" rx="20" fill="#07070C"/>

<g stroke="#ffffff" stroke-opacity=".07" stroke-width="1" fill="none">
<use xlink:href="#a1"/><use xlink:href="#a2"/><use xlink:href="#a3"/>
<use xlink:href="#b1"/><use xlink:href="#b2"/><use xlink:href="#b3"/>
</g>

<g fill="none" stroke="#2A2A3A" stroke-width="1.5">
<circle cx="140" cy="90" r="26"/><circle cx="140" cy="190" r="26"/><circle cx="140" cy="290" r="26"/>
<circle cx="1060" cy="90" r="26"/><circle cx="1060" cy="190" r="26"/><circle cx="1060" cy="290" r="26"/>
</g>
<g fill="#4E4E63">
<circle cx="140" cy="90" r="5"/><circle cx="140" cy="190" r="5"/><circle cx="140" cy="290" r="5"/>
</g>
<g fill="#00E5FF">
<circle cx="1060" cy="90" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="1060" cy="190" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
<circle cx="1060" cy="290" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
</g>

<path d="M600 108 L664 134 V196 C664 234 600 256 600 256 C600 256 536 234 536 196 V134 Z" fill="url(#esc)" stroke="#B026FF" stroke-width="1.5"/>
<path d="M578 182 l14 15 l30 -32" fill="none" stroke="#B026FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="600" cy="182" r="72" fill="none" stroke="#B026FF" stroke-width="1">
  <animate attributeName="r" values="60;96" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values=".35;0" dur="3s" repeatCount="indefinite"/>
</circle>

<circle r="4" fill="#00E5FF"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath xlink:href="#a1"/></animateMotion></circle>
<circle r="4" fill="#00E5FF"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#a3"/></animateMotion></circle>
<circle r="4" fill="#00E5FF"><animateMotion dur="1.8s" begin="0.3s" repeatCount="indefinite"><mpath xlink:href="#b1"/></animateMotion></circle>
<circle r="4" fill="#00E5FF"><animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite"><mpath xlink:href="#b2"/></animateMotion></circle>
<circle r="4" fill="#00E5FF"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#b3"/></animateMotion></circle>

<g>
<circle r="5" fill="#FF3B6B">
  <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.35;0.85;1" calcMode="linear"><mpath xlink:href="#a2"/></animateMotion>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.55;0.99;1" dur="4s" repeatCount="indefinite"/>
</circle>
</g>
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.38;0.5;0.56;1" dur="4s" repeatCount="indefinite"/>
  <path d="M528 172 l16 16 M544 172 l-16 16" stroke="#FF3B6B" stroke-width="2.5" stroke-linecap="round"/>
</g>

<text class="m" x="140" y="344" text-anchor="middle" font-size="12.5" fill="#6A6A85">clientes</text>
<text class="m" x="600" y="300" text-anchor="middle" font-size="12.5" fill="#B026FF">cortafuegos</text>
<text class="m" x="1060" y="344" text-anchor="middle" font-size="12.5" fill="#6A6A85">servicios</text>
<text class="m" x="600" y="344" text-anchor="middle" font-size="11" fill="#4E4E63">tráfico legítimo pasa · el resto se queda fuera</text>
</svg>
